name: MultiDisplayManagement
options:
  bundleIdPrefix: personal.phib
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: XW848M73T3
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: "7"
packages:
  AppleSiliconDDC:
    path: Vendor/AppleSiliconDDC
targets:
  MultiDisplayManagement:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Multi Display
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.phib.MultiDisplayManagement
        PRODUCT_NAME: Multi Display
        ENABLE_APP_SANDBOX: "NO"
    dependencies:
      - package: AppleSiliconDDC
